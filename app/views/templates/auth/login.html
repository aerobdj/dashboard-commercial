<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Commercial Dashboard Airport</title>
    
    <!-- Mazer UI CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='compiled/css/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='compiled/css/app-dark.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='compiled/css/auth.css') }}">
</head>
<body>
    <div id="auth">
        <div class="row h-100">
            <div class="col-lg-5 col-12 ms-auto me-auto mt-5">
                <div id="auth-left">
                    <h1 class="auth-title">Log in.</h1>
                    <p class="auth-subtitle mb-4">Masuk ke Commercial Dashboard Airport.</p>

                    {% with messages = get_flashed_messages() %}
                      {% if messages %}
                        <div class="alert alert-danger py-2 mb-3">
                          {{ messages[0] }}
                        </div>
                      {% endif %}
                    {% endwith %}

                    <form action="/login" method="POST">
                        <div class="form-group position-relative has-icon-left mb-4">
                            <input type="email" name="email" class="form-control form-control-xl" placeholder="Email" required>
                            <div class="form-control-icon">
                                <i class="bi bi-person"></i>
                            </div>
                        </div>
                        <div class="form-group position-relative has-icon-left mb-4">
                            <input type="password" name="password" class="form-control form-control-xl" placeholder="Password" required>
                            <div class="form-control-icon">
                                <i class="bi bi-shield-lock"></i>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block btn-lg shadow-lg mt-3 w-100">Log in</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
