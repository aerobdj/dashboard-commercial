{% extends 'layouts/base.html' %}

{% block title %}Dashboard Utama - Commercial Airport{% endblock %}

{% block content %}
<div class="page-heading">
    <h3>Commercial Dashboard</h3>
    <p class="text-subtitle text-muted">Selamat datang kembali, <strong>{{ user.email }}</strong></p>
</div>

<div class="page-content">
    <section class="row">
        <div class="col-12 col-lg-9">
            <div class="row">
                <div class="col-6 col-lg-4 col-md-6">
                    <div class="card">
                        <div class="card-body px-4 py-4-5">
                            <div class="row">
                                <div class="col-md-4 col-lg-12 col-xl-12 col-xxl-5 d-flex justify-content-start">
                                    <div class="stats-icon purple mb-2">
                                        <i class="iconly-boldShow"></i>
                                    </div>
                                </div>
                                <div class="col-md-8 col-lg-12 col-xl-12 col-xxl-7">
                                    <h6 class="text-muted font-semibold">Total Tenant</h6>
                                    <h6 class="font-extrabold mb-0">24</h6>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
{% endblock %}
