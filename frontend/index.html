<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commercial Dashboard - Mazer</title>
    
    <!-- CSS Mazer & Bootstrap 5 via CDN (Tanpa Install Local) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/zurtemplates/mazer@main/dist/assets/css/main/app.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/zurtemplates/mazer@main/dist/assets/css/main/app-dark.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
    <div id="app">
        <!-- SIDEBAR / MAIN MENU -->
        <div id="sidebar" class="active">
            <div class="sidebar-wrapper active">
                <div class="sidebar-header position-relative">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="logo">
                            <a href="#"><h4 class="m-0 font-bold">Commercial</h4></a>
                        </div>
                    </div>
                </div>
                <div class="sidebar-menu">
                    <ul class="menu">
                        <li class="sidebar-title">Menu Utama</li>
                        
                        <li class="sidebar-item active" id="menu-dashboard">
                            <a href="#" onclick="switchTab('dashboard')" class="sidebar-link">
                                <i class="bi bi-grid-fill"></i>
                                <span>Dashboard Summary</span>
                            </a>
                        </li>

                        <li class="sidebar-title">Forms & Data</li>

                        <li class="sidebar-item" id="menu-form-tenant">
                            <a href="#" onclick="switchTab('form-tenant')" class="sidebar-link">
                                <i class="bi bi-building"></i>
                                <span>Form Tenant</span>
                            </a>
                        </li>

                        <li class="sidebar-item" id="menu-form-utility">
                            <a href="#" onclick="switchTab('form-utility')" class="sidebar-link">
                                <i class="bi bi-lightning-charge-fill"></i>
                                <span>Form Utility</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- MAIN CONTENT AREA -->
        <div id="main" class="layout-horizontal">
            <header class="mb-3">
                <a href="#" class="burger-btn d-block d-xl-none">
                    <i class="bi bi-justify fs-3"></i>
                </a>
            </header>

            <div class="page-heading">
                <h3>Commercial Admin Dashboard</h3>
            </div>

            <div class="page-content">
                
                <!-- TAB 1: DASHBOARD SUMMARY -->
                <div id="tab-dashboard" class="tab-content">
                    <div class="row">
                        <div class="col-6 col-lg-4 col-md-6">
                            <div class="card">
                                <div class="card-body px-4 py-4-5">
                                    <div class="row">
                                        <div class="col-md-4 col-lg-12 col-xl-12 col-xxl-5 d-flex justify-content-start">
                                            <div class="stats-icon purple mb-2">
                                                <i class="iconly-boldShow"></i>
                                            </div>
                                        </div>
                                        <div class="col-md-8 col-lg-12 col-xl-12 col-xxl-7">
                                            <h6 class="text-muted font-semibold">Total Tenant Active</h6>
                                            <h6 class="font-extrabold mb-0" id="total-tenant-count">0</h6>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: FORM TENANT -->
                <div id="tab-form-tenant" class="tab-content d-none">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="card-title">Registrasi Tenant Baru</h4>
                        </div>
                        <div class="card-body">
                            <form id="tenantForm">
                                <div class="form-group mb-3">
                                    <label for="tenantName" class="form-label">Nama Tenant / Usaha</label>
                                    <input type="text" class="form-control" id="tenantName" placeholder="Contoh: Coffee Shop Alpha" required>
                                </div>
                                <div class="form-group mb-3">
                                    <label for="tenantCategory" class="form-label">Kategori Usaha</label>
                                    <select class="form-select" id="tenantCategory">
                                        <option value="F&B">F&B</option>
                                        <option value="Retail">Retail</option>
                                        <option value="Services">Services</option>
                                    </select>
                                </div>
                                <button type="button" onclick="submitTenantData()" class="btn btn-primary me-1 mb-1">Simpan Tenant</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- TAB 3: FORM UTILITY -->
                <div id="tab-form-utility" class="tab-content d-none">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="card-title">Input Utility (Listrik & Air)</h4>
                        </div>
                        <div class="card-body">
                            <p class="text-muted">Form pencatatan meteran utility tenant.</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Script Utama -->
    <script src="app.js"></script>
</body>
</html>
